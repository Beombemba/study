<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>차반 자리 정하기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0D13;--sf:#13161F;--card:#181C2A;--bd:#232840;--pri:#4E6AE6;--pri2:#7C93FF;--tx:#E8EAF2;--sub:#8A90A8;--gold:#F2C94C;--ok:#3DD68C;--bad:#FF6B6B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:900;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:14px}
.card h2{font-size:15px;font-weight:700;margin-bottom:10px}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:6px}
input,textarea{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font:inherit;font-size:15px;padding:10px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--pri)}
textarea{min-height:200px;resize:vertical;line-height:1.6}
.row{display:flex;gap:10px;align-items:flex-end}
.row>*{flex:1}
.btn{border:0;border-radius:10px;padding:12px 14px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:8px 10px;font-size:13px}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
.front{text-align:center;font-size:12px;font-weight:700;color:var(--sub);background:var(--sf);border:1px dashed var(--bd);border-radius:8px;padding:6px;margin-bottom:10px;letter-spacing:2px}
.grid{display:grid;gap:6px}
.seat{aspect-ratio:1/0.9;border-radius:10px;border:1.5px solid var(--bd);background:var(--sf);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub);cursor:pointer;user-select:none;padding:2px;text-align:center;overflow:hidden;transition:transform .08s}
.seat:active{transform:scale(.95)}
.seat.off{background:transparent;border-style:dashed;opacity:.35}
.seat.free{border-color:var(--pri2);color:var(--tx)}
.seat.taken{background:#22284a;border-color:var(--pri);color:var(--tx)}
.seat.last{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,201,76,.3)}
.seat .rk{font-size:10px;font-weight:900;color:var(--gold)}
.seat .nm{font-size:12px;font-weight:700;line-height:1.2;word-break:keep-all}
.seat .pos{font-size:10px}
.turn{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#1d2550,#141a33);border:1px solid var(--pri);border-radius:14px;padding:14px 16px;margin-top:14px;display:flex;align-items:center;gap:12px}
.turn .big{font-size:28px;font-weight:900;color:var(--gold);min-width:56px;text-align:center}
.turn .who{font-size:18px;font-weight:900}
.turn .nx{font-size:12px;color:var(--sub);margin-top:2px}
.turn.done{border-color:var(--ok);background:linear-gradient(135deg,#123a2a,#10221b)}
.turn.done .big{color:var(--ok)}
.list{font-size:14px;line-height:1.9}
.list span{color:var(--sub)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl">차반 자리 정하기</h1>
  <div class="sub" id="subt">1등부터 한 명씩 원하는 자리를 골라요</div>

  <!-- 설정 -->
  <section id="setup">
    <div class="card">
      <h2>① 순위 명단</h2>
      <label>한 줄에 한 명씩, 1등부터 순서대로</label>
      <textarea id="names" placeholder="홍길동&#10;김철수&#10;이영희&#10;..."></textarea>
      <div class="row" style="margin-top:10px">
        <div><label>이름 없이 인원만</label><input id="cnt" type="number" min="1" max="99" value="15" inputmode="numeric"></div>
        <button class="btn sm" id="fillNum" style="flex:0 0 auto">1등~N등으로 채우기</button>
      </div>
    </div>

    <div class="card">
      <h2>② 자리 배치</h2>
      <div class="row">
        <div><label>앞에서부터 줄 수</label><input id="rows" type="number" min="1" max="12" value="3" inputmode="numeric"></div>
        <div><label>한 줄 자리 수</label><input id="cols" type="number" min="1" max="12" value="5" inputmode="numeric"></div>
      </div>
      <div class="hint">아래에서 자리를 탭하면 <b>없는 자리(통로·빈칸)</b>로 바뀌어요. 다시 탭하면 복구.</div>
      <div class="card" style="background:var(--bg)">
        <div class="front">앞 · 교탁</div>
        <div class="grid" id="setupGrid"></div>
      </div>
      <div class="hint" id="seatInfo"></div>
    </div>

    <div class="card">
      <h2>③ 제목 (선택)</h2>
      <input id="title" placeholder="예: 26-4기 지상학교 자리">
    </div>

    <div class="btns"><button class="btn pri" id="start">자리 정하기 시작</button></div>
  </section>

  <!-- 자리 고르기 -->
  <section id="pick" class="hide">
    <div class="turn" id="turn">
      <div class="big" id="turnRank">1등</div>
      <div><div class="who" id="turnName"></div><div class="nx" id="turnNext"></div></div>
    </div>
    <div class="card">
      <div class="front">앞 · 교탁</div>
      <div class="grid" id="pickGrid"></div>
    </div>
    <div class="btns">
      <button class="btn" id="undo">↩︎ 되돌리기</button>
      <button class="btn" id="edit">설정 수정</button>
    </div>
    <div class="card" id="resultCard">
      <h2>결과</h2>
      <div class="list" id="resultList"></div>
      <div class="btns">
        <button class="btn sm" id="copyTxt">텍스트 복사</button>
        <button class="btn sm" id="copyLink">결과 링크 복사</button>
      </div>
      <div class="hint">결과 링크를 단톡방에 보내면 동기들이 같은 배치도를 볼 수 있어요.</div>
    </div>
    <div class="btns"><button class="btn" id="reset" style="color:var(--bad)">처음부터 다시</button></div>
  </section>

  <!-- 공유된 결과 보기 -->
  <section id="view" class="hide">
    <div class="card">
      <div class="front">앞 · 교탁</div>
      <div class="grid" id="viewGrid"></div>
    </div>
    <div class="card"><h2>명단</h2><div class="list" id="viewList"></div></div>
    <div class="btns"><a class="btn" href="./" style="text-align:center;text-decoration:none">새로 정하기</a></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'chaban-seat-v1';
let S = { rows:3, cols:5, off:[], names:[], title:'', picks:[] }; // picks[i] = seat index chosen by rank i
let phase = 'setup';

function save(){ try{ localStorage.setItem(KEY, JSON.stringify({S, phase})); }catch(e){} }
function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.S){ S = Object.assign(S, d.S); phase = d.phase || 'setup'; } }catch(e){} }

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1600); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function posLabel(i){ const r=Math.floor(i/S.cols)+1; const offBefore=S.off.filter(x=>x<i && Math.floor(x/S.cols)===r-1).length; const c=(i%S.cols)+1-offBefore; return `${r}줄 ${c}번`; }
function seatCount(){ return S.rows*S.cols - S.off.length; }
function parseNames(){ return $('names').value.split('\n').map(s=>s.trim()).filter(Boolean); }

/* ---------- 설정 ---------- */
function renderSetup(){
  const g=$('setupGrid'); g.style.gridTemplateColumns=`repeat(${S.cols},1fr)`; g.innerHTML='';
  for(let i=0;i<S.rows*S.cols;i++){
    const d=document.createElement('div'); const off=S.off.includes(i);
    d.className='seat '+(off?'off':'free');
    d.innerHTML= off ? '<span class="pos">없음</span>' : `<span class="pos">${posLabel(i)}</span>`;
    d.onclick=()=>{ S.off = off ? S.off.filter(x=>x!==i) : [...S.off,i]; save(); renderSetup(); };
    g.appendChild(d);
  }
  const n=parseNames().length;
  $('seatInfo').innerHTML=`자리 <b>${seatCount()}</b>개 · 인원 <b>${n}</b>명` + (n>seatCount()?` <span style="color:var(--bad)">— 자리가 부족해요</span>`:'');
}
function readSetupInputs(){
  const r=Math.max(1,Math.min(12,+$('rows').value||1)), c=Math.max(1,Math.min(12,+$('cols').value||1));
  if(r!==S.rows||c!==S.cols){ S.off=[]; }
  S.rows=r; S.cols=c; S.names=parseNames(); S.title=$('title').value.trim();
}
['rows','cols'].forEach(id=>$(id).addEventListener('input',()=>{ readSetupInputs(); save(); renderSetup(); }));
$('names').addEventListener('input',()=>{ S.names=parseNames(); save(); renderSetup(); });
$('title').addEventListener('input',()=>{ S.title=$('title').value.trim(); save(); });
$('fillNum').onclick=()=>{
  const n=Math.max(1,Math.min(99,+$('cnt').value||15));
  $('names').value=Array.from({length:n},(_,i)=>`${i+1}등`).join('\n');
  S.names=parseNames(); save(); renderSetup();
};
$('start').onclick=()=>{
  readSetupInputs();
  if(!S.names.length) return toast('명단을 먼저 넣어주세요');
  if(S.names.length>seatCount()) return toast(`자리(${seatCount()})가 인원(${S.names.length})보다 적어요`);
  S.picks = S.picks.filter((s,i)=>i<S.names.length && !S.off.includes(s) && s<S.rows*S.cols);
  phase='pick'; save(); show();
};

/* ---------- 자리 고르기 ---------- */
function owner(i){ const k=S.picks.indexOf(i); return k; }
function seatHTML(i, rankIdx){
  if(rankIdx<0) return `<span class="pos">${posLabel(i)}</span>`;
  return `<span class="rk">${rankIdx+1}등</span><span class="nm">${esc(S.names[rankIdx])===`${rankIdx+1}등`?'':esc(S.names[rankIdx])}</span><span class="pos">${posLabel(i)}</span>`;
}
function renderPick(){
  const g=$('pickGrid'); g.style.gridTemplateColumns=`repeat(${S.cols},1fr)`; g.innerHTML='';
  const cur=S.picks.length, done=cur>=S.names.length, lastSeat=S.picks[cur-1];
  for(let i=0;i<S.rows*S.cols;i++){
    const d=document.createElement('div');
    if(S.off.includes(i)){ d.className='seat off'; g.appendChild(d); continue; }
    const k=owner(i);
    d.className='seat '+(k>=0?'taken':'free')+(i===lastSeat?' last':'');
    d.innerHTML=seatHTML(i,k);
    d.onclick=()=>{
      if(done) return toast('모두 정해졌어요');
      if(k>=0) return toast(`${k+1}등이 이미 고른 자리예요`);
      S.picks.push(i); save(); renderPick();
      if(navigator.vibrate) try{navigator.vibrate(15)}catch(e){}
    };
    g.appendChild(d);
  }
  const t=$('turn');
  if(done){
    t.classList.add('done'); $('turnRank').textContent='완료'; $('turnName').textContent='자리 배치 끝!'; $('turnNext').textContent=`${S.names.length}명 모두 정해졌어요`;
  }else{
    t.classList.remove('done'); $('turnRank').textContent=`${cur+1}등`;
    $('turnName').textContent = S.names[cur]===`${cur+1}등` ? '차례입니다' : `${S.names[cur]} 차례`;
    $('turnNext').textContent = cur+1<S.names.length ? `다음: ${cur+2}등 ${S.names[cur+1]===`${cur+2}등`?'':S.names[cur+1]}` : '마지막 순서';
  }
  $('undo').disabled=!cur;
  $('resultList').innerHTML = S.picks.length ? S.picks.map((s,i)=>`<div><b>${i+1}등</b> ${S.names[i]===`${i+1}등`?'':esc(S.names[i])} <span>→ ${posLabel(s)}</span></div>`).join('') : '<span>아직 고른 사람이 없어요</span>';
}
$('undo').onclick=()=>{ const s=S.picks.pop(); save(); renderPick(); if(s!==undefined) toast('한 명 되돌렸어요'); };
$('edit').onclick=()=>{ phase='setup'; save(); show(); };
$('reset').onclick=()=>{ if(!S.picks.length || confirmReset()){ S.picks=[]; save(); renderPick(); } };
function confirmReset(){ const b=$('reset'); if(b.dataset.arm){ delete b.dataset.arm; b.textContent='처음부터 다시'; return true; } b.dataset.arm=1; b.textContent='한 번 더 누르면 초기화'; setTimeout(()=>{delete b.dataset.arm; b.textContent='처음부터 다시';},2500); return false; }

function resultText(){
  const head = S.title || '차반 자리 배치';
  return head+'\n'+S.picks.map((s,i)=>`${i+1}등 ${S.names[i]===`${i+1}등`?'':S.names[i]+' '}→ ${posLabel(s)}`).join('\n');
}
function b64(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); return decodeURIComponent(escape(atob(s))); }
async function copy(text, msg){
  try{ await navigator.clipboard.writeText(text); toast(msg); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast(msg);}catch(_){ toast('복사 실패 — 길게 눌러 복사해 주세요'); } ta.remove(); }
}
$('copyTxt').onclick=()=>copy(resultText(),'텍스트를 복사했어요');
$('copyLink').onclick=()=>{
  const data={r:S.rows,c:S.cols,o:S.off,n:S.names.slice(0,S.picks.length),p:S.picks,t:S.title};
  copy(location.origin+location.pathname+'#v='+b64(JSON.stringify(data)),'결과 링크를 복사했어요');
};

/* ---------- 공유 결과 보기 ---------- */
function renderView(d){
  S={rows:d.r,cols:d.c,off:d.o||[],names:d.n||[],picks:d.p||[],title:d.t||''};
  const g=$('viewGrid'); g.style.gridTemplateColumns=`repeat(${S.cols},1fr)`; g.innerHTML='';
  for(let i=0;i<S.rows*S.cols;i++){
    const el=document.createElement('div');
    if(S.off.includes(i)){ el.className='seat off'; }
    else{ const k=owner(i); el.className='seat '+(k>=0?'taken':''); el.innerHTML=seatHTML(i,k); }
    g.appendChild(el);
  }
  $('viewList').innerHTML=S.picks.map((s,i)=>`<div><b>${i+1}등</b> ${S.names[i]===`${i+1}등`?'':esc(S.names[i])} <span>→ ${posLabel(s)}</span></div>`).join('');
  $('ttl').textContent=S.title||'차반 자리 배치'; $('subt').textContent='공유된 결과';
}

/* ---------- 화면 전환 ---------- */
function show(){
  $('setup').classList.toggle('hide',phase!=='setup');
  $('pick').classList.toggle('hide',phase!=='pick');
  $('view').classList.add('hide');
  $('ttl').textContent = S.title || '차반 자리 정하기';
  if(phase==='setup'){
    $('rows').value=S.rows; $('cols').value=S.cols; $('names').value=S.names.join('\n'); $('title').value=S.title;
    renderSetup();
  } else renderPick();
  window.scrollTo(0,0);
}

const m=location.hash.match(/^#v=(.+)$/);
if(m){
  try{ const d=JSON.parse(unb64(m[1])); $('setup').classList.add('hide'); $('view').classList.remove('hide'); renderView(d); }
  catch(e){ load(); show(); toast('결과 링크를 읽지 못했어요'); }
}else{ load(); show(); }
</script>
</body>
</html>
